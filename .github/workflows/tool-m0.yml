name: Tool foundation and CLI
on:
  push:
    paths: ['tool/**', '.github/workflows/tool-m0.yml', 'QAirline/specs/**']
  pull_request:
    paths: ['tool/**', '.github/workflows/tool-m0.yml', 'QAirline/specs/**']
jobs:
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: apitesting
          python-version: '3.12'
          auto-activate-base: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock
        working-directory: tool/backend
      - run: python -m pytest -q
        working-directory: tool/backend
      - run: python -m ruff check app tests scripts
        working-directory: tool/backend
      - run: python -m pip check
        working-directory: tool/backend
      - run: python -m app.cli --help
        working-directory: tool/backend
      - run: python -m app.worker --check
        working-directory: tool/backend
      - run: npm ci
        working-directory: tool/frontend
      - run: npm run build
        working-directory: tool/frontend
